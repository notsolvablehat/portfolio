<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- SOLVABLEHAT: a pixel top hat -->
  <rect width="16" height="16" rx="3" fill="#fdf0d5"/>
  <!-- crown -->
  <rect x="4" y="2" width="8" height="6" fill="#323232"/>
  <rect x="5" y="3" width="1" height="3" fill="#4d4d4d"/>
  <!-- band -->
  <rect x="4" y="8" width="8" height="2" fill="#e63e21"/>
  <rect x="10" y="8" width="1" height="2" fill="#ffffff"/>
  <!-- brim -->
  <rect x="2" y="10" width="12" height="1" fill="#323232"/>
  <rect x="1" y="11" width="14" height="2" fill="#323232"/>
</svg>
